</main>
</div>

<nav class="nav" aria-label="Controles da apresentação">
  <button class="nbtn" id="btnPrev" aria-label="Slide anterior">&lsaquo;</button>
  <span class="count" id="counter">1</span>
  <button class="nbtn" id="btnNext" aria-label="Próximo slide">&rsaquo;</button>
  <span class="sep"></span>
  <div class="dots" id="dots"></div>
  <span class="sep"></span>
  <button class="nbtn" id="btnOv" aria-label="Visão geral dos slides" title="Visão geral (O)">&#9783;</button>
  <button class="nbtn" id="btnTheme" aria-label="Alternar modo escuro" title="Modo escuro (D)">&#9788;</button>
  <button class="nbtn" id="btnFs" aria-label="Tela cheia" title="Tela cheia (F)">&#9974;</button>
</nav>
<div id="ov" role="dialog" aria-modal="true" aria-label="Todos os slides"><h3>Todos os slides</h3><p class="ovh">Clique para ir ao slide · O ou Esc para fechar</p><div id="ovg"></div></div>
<div id="hint">← → navegam · O visão geral · D modo escuro · F tela cheia</div>
<div id="tip" role="tooltip"></div>

<script>
(function(){
'use strict';
var root=document.documentElement, deck=document.getElementById('deck');
var slides=[].slice.call(document.querySelectorAll('.slide'));
var TOTAL=slides.length, idx=0;
var counter=document.getElementById('counter'), pbar=document.getElementById('pbar'), brand=document.getElementById('brand');

/* ---------- palco: escala fixa 1600x900, ou leitura vertical em telas estreitas ---------- */
function isMobile(){ return window.innerWidth < 820 || (window.innerWidth < 1000 && window.innerHeight > window.innerWidth); }
function fitStage(){
  if (isMobile()){ root.classList.add('mobile'); deck.style.transform='none'; return; }
  root.classList.remove('mobile');
  var pad = 22;
  var k = Math.min((window.innerWidth-pad)/1600,(window.innerHeight-pad)/900);
  deck.style.transform='translate(-50%,-50%) scale('+k+')';
}
window.addEventListener('resize',fitStage);

/* ---------- navegação ---------- */
var dotsBox=document.getElementById('dots'), ovg=document.getElementById('ovg');
slides.forEach(function(s,i){
  var d=document.createElement('button'); d.className='dot'+(s.dataset.divider?' sec':''); d.setAttribute('aria-label','Ir ao slide '+(i+1));
  d.title=s.dataset.title||''; d.addEventListener('click',function(){goTo(i,i<idx);}); dotsBox.appendChild(d);
  var c=document.createElement('button'); c.className='ovc';
  c.innerHTML='<span class="on2">'+(i+1<10?'0':'')+(i+1)+'</span><span class="ot"></span>';
  c.querySelector('.ot').textContent=s.dataset.title||'';
  c.addEventListener('click',function(){toggleOv(false);goTo(i,i<idx);}); ovg.appendChild(c);
});
function update(){
  counter.textContent=(idx+1)+' / '+TOTAL;
  pbar.style.width=(idx/(TOTAL-1)*100)+'%';
  [].forEach.call(dotsBox.children,function(d,i){d.classList.toggle('on',i===idx);});
  [].forEach.call(ovg.children,function(c,i){c.classList.toggle('on',i===idx);});
  var s=slides[idx];
  var onLight=s.dataset.theme==='light' && root.dataset.themeMode!=='dark';
  brand.classList.toggle('on-light',onLight);
  if (FIELD) FIELD.setMode(s.dataset.theme==='dark' || root.dataset.themeMode==='dark', !!s.dataset.divider || s.classList.contains('t-cover'));
  deck.style.setProperty('--field-a', s.dataset.divider ? .9 : 1);
}
function goTo(n,back){
  n=Math.max(0,Math.min(TOTAL-1,n));
  if (n===idx) return;
  document.body.classList.toggle('back',!!back);
  slides[idx].classList.remove('active'); idx=n; slides[idx].classList.add('active');
  update(); hideTip();
  setTimeout(function(){document.body.classList.remove('back');},620);
}
function next(){goTo(idx+1,false);} function prev(){goTo(idx-1,true);}
document.getElementById('btnNext').addEventListener('click',next);
document.getElementById('btnPrev').addEventListener('click',prev);
var ov=document.getElementById('ov');
function toggleOv(on){ ov.classList.toggle('on', on===undefined ? !ov.classList.contains('on') : on); }
document.getElementById('btnOv').addEventListener('click',function(){toggleOv();});
function toggleTheme(){ root.dataset.themeMode = root.dataset.themeMode==='dark' ? 'light' : 'dark'; update(); }
document.getElementById('btnTheme').addEventListener('click',toggleTheme);
function toggleFs(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(e){} }
document.getElementById('btnFs').addEventListener('click',toggleFs);
document.addEventListener('keydown',function(e){
  if (e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if (root.classList.contains('mobile')) return;
  var k=e.key;
  if (k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
  else if (k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
  else if (k==='Home'){goTo(0,true);} else if (k==='End'){goTo(TOTAL-1,false);}
  else if (k==='o'||k==='O'){toggleOv();} else if (k==='Escape'){toggleOv(false);}
  else if (k==='d'||k==='D'){toggleTheme();} else if (k==='f'||k==='F'){toggleFs();}
});
var tx=null;
deck.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
deck.addEventListener('touchend',function(e){ if(tx===null||root.classList.contains('mobile'))return; var dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50){dx<0?next():prev();} tx=null; });

/* ---------- tooltip de hover (barras, pontos, segmentos) ---------- */
var tip=document.getElementById('tip');
function showTip(html,x,y){ tip.innerHTML=html; tip.classList.add('on');
  var w=tip.offsetWidth,h=tip.offsetHeight; var px=x+14, py=y-h-12;
  if (px+w>window.innerWidth-8) px=x-w-14; if (py<8) py=y+16; tip.style.left=px+'px'; tip.style.top=py+'px'; }
function hideTip(){ tip.classList.remove('on'); }
document.addEventListener('mousemove',function(e){
  var t=e.target.closest ? e.target.closest('[data-tip]') : null;
  if (t) showTip(t.getAttribute('data-tip'),e.clientX,e.clientY); else if (!e.target.closest('svg.line')) hideTip();
});

/* ---------- gráfico de linha: abstenção ---------- */
function lineChart(svg,data,opt){
  var W=640,H=420,L=48,R=24,T=20,B=36, NS='http://www.w3.org/2000/svg';
  var x=function(i){return L+i*(W-L-R)/(data.length-1);}, y=function(v){return T+(opt.max-v)/(opt.max-opt.min)*(H-T-B);};
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  opt.ticks.forEach(function(t){ el('line',{x1:L,x2:W-R,y1:y(t),y2:y(t),'class':'gl'}); var tx=el('text',{x:L-8,y:y(t)+4,'text-anchor':'end','class':'ax'}); tx.textContent=t.toString().replace('.',',')+'%'; });
  if (opt.ref){ el('line',{x1:L,x2:W-R,y1:y(opt.ref.v),y2:y(opt.ref.v),'class':'ref'}); var rt=el('text',{x:W-R,y:y(opt.ref.v)-6,'text-anchor':'end','class':'ax'}); rt.textContent=opt.ref.label; }
  data.forEach(function(d,i){ var t=el('text',{x:x(i),y:H-10,'text-anchor':'middle','class':'ax'}); t.textContent=d.k; });
  el('path',{d:data.map(function(d,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(d.v).toFixed(1);}).join(' '),'class':'ln'});
  var xh=el('line',{y1:T,y2:H-B,'class':'xh'});
  data.forEach(function(d,i){ el('circle',{cx:x(i),cy:y(d.v),r:i===data.length-1?6:4.5,'class':'mk'+(i===data.length-1?' last':'')}); });
  var lb=el('text',{x:x(data.length-1)-10,y:y(data[data.length-1].v)+22,'text-anchor':'end','class':'lbl'}); lb.textContent='21,08% em 2026';
  var lb2=el('text',{x:x(1),y:y(data[1].v)+22,'text-anchor':'middle','class':'lbl'}); lb2.textContent='16,75%';
  var hit=el('rect',{x:L,y:T,width:W-L-R,height:H-T-B,'class':'hit'});
  hit.addEventListener('mousemove',function(e){
    var r=svg.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*W;
    var i=Math.round((px-L)/((W-L-R)/(data.length-1))); i=Math.max(0,Math.min(data.length-1,i));
    xh.setAttribute('x1',x(i)); xh.setAttribute('x2',x(i)); xh.style.opacity=1;
    showTip('<b>'+data[i].k+'</b><br>Abstenção: '+data[i].v.toFixed(2).replace('.',',')+'%',e.clientX,e.clientY);
  });
  hit.addEventListener('mouseleave',function(){xh.style.opacity=0;hideTip();});
}

/* ---------- campo animado (pontos à deriva) atrás dos slides escuros ---------- */
var FIELD=(function(){
  var cv=document.getElementById('field'); if(!cv||!cv.getContext) return null;
  var ctx=cv.getContext('2d'), DPR=Math.min(window.devicePixelRatio||1,1.6), W=1600,H=900;
  cv.width=W*DPR; cv.height=H*DPR; ctx.scale(DPR,DPR);
  var N=900, pts=[], running=false, show=true, ring=true, t0=0;
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (var i=0;i<N;i++){
    var z=Math.random()*.8+.2, a=Math.random()*Math.PI*2, rr=i%3===0?230:(i%3===1?150:320);
    pts.push({x:Math.random()*W,y:Math.random()*H,z:z,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.22,
      ring:i<N*.42, tx:1230+Math.cos(a)*rr*(0.96+Math.random()*.08), ty:440+Math.sin(a)*rr*(0.96+Math.random()*.08), ph:Math.random()*6.28});
  }
  function frame(ts){
    if (!running) return;
    var t=ts/1000; ctx.clearRect(0,0,W,H);
    for (var i=0;i<N;i++){
      var p=pts[i];
      if (ring && p.ring){
        var ang=t*.05*(p.z>.6?1:-1), cx=1230, cy=440, dx=p.tx-cx, dy=p.ty-cy;
        var gx=cx+dx*Math.cos(ang)-dy*Math.sin(ang), gy=cy+dx*Math.sin(ang)+dy*Math.cos(ang);
        p.x+=(gx-p.x)*.03; p.y+=(gy-p.y)*.03;
      } else {
        p.x+=p.vx*p.z*1.4; p.y+=p.vy*p.z*1.4;
        if(p.x<-10)p.x=W+10; if(p.x>W+10)p.x=-10; if(p.y<-10)p.y=H+10; if(p.y>H+10)p.y=-10;
      }
      var al=(.18+.55*p.z)*(.75+.25*Math.sin(t*1.3+p.ph));
      ctx.fillStyle=p.ring&&ring ? 'rgba(143,180,236,'+al+')' : 'rgba(195,215,238,'+(al*.8)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,.6+1.5*p.z,0,6.283); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  function start(){ if(!running && show && !reduce && !document.hidden && !root.classList.contains('mobile')){ running=true; requestAnimationFrame(frame);} }
  function stop(){ running=false; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  if (reduce){ /* um quadro estático */ ctx.fillStyle='rgba(195,215,238,.4)'; pts.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,1,0,6.283);ctx.fill();}); }
  return { setMode:function(dark,r){ show=dark; ring=r; if(show) start(); else { stop(); ctx.clearRect(0,0,W,H);} } };
})();


/* ---------- selo de destaque + navegação que se recolhe ---------- */
var TIERN={'1':'1º destaque · Tecnologia e IA','2':'2º destaque · Economia e mercados','3':'3º destaque · Política e demais temas'};
slides.forEach(function(s,i){
  var t=s.dataset.tier; if(!t) return;
  if (s.dataset.theme==='light'){ var p=document.createElement('div'); p.className='tierpill t'+t; p.innerHTML='<i></i>'+TIERN[t]; s.insertBefore(p,s.firstChild); }
  if (dotsBox.children[i]) dotsBox.children[i].classList.add('t'+t);
});
var idleT=null;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(function(){ if(!document.querySelector('.nav:hover')) document.body.classList.add('idle'); },2600); }
['mousemove','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev,wake,{passive:true}); });
wake();

fitStage(); update();
var hint=document.getElementById('hint');
if (!root.classList.contains('mobile')){ setTimeout(function(){hint.classList.add('on');},900); setTimeout(function(){hint.classList.remove('on');},5200); }
})();
</script>
</body>
</html>
